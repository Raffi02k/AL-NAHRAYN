<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 | ALNAHRAYN Fisk</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0907;
      --panel: rgba(19, 16, 12, 0.92);
      --line: rgba(213, 183, 129, 0.26);
      --text: #f2eadc;
      --muted: rgba(242, 234, 220, 0.72);
      --gold: #d5b781;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(11, 9, 7, 0.76), rgba(11, 9, 7, 0.94)),
        url('/images/05_grillad_karp_masgouf.png') center / cover no-repeat;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 720px);
      padding: 40px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(3rem, 10vw, 5.5rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    a.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #0b0907;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      main {
        padding: 28px 22px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · Sidan hittades inte</p>
    <h1>Den sidan finns inte.</h1>
    <p>Det verkar bara vara den här sidan som saknas, inte hela webbplatsen.</p>
    <p>Gå tillbaka till startsidan, öppna menyn eller kontakta restaurangen om länken verkar fel.</p>
    <div class="actions">
      <a class="primary" href="/">Till startsidan</a>
      <a href="/meny">Se menyn</a>
      <a href="/kontakt">Hitta hit</a>
    </div>
  </main>
</body>
</html>
